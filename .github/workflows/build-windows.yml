name: Build SEZ Print Service installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "print-engine.js"
      - "package.json"
      - "tests/**"
      - "setup.iss"
      - "install-runtime.ps1"
      - "install-service.ps1"
      - "uninstall-service.ps1"
      - "start-service.vbs"
      - "start-service.cmd"
      - "VERSION.txt"
      - "LEIA-ME.txt"
      - "README.md"
      - "LICENSE-SUMATRAPDF.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout SEZ Print Service
        uses: actions/checkout@v4

      - name: Setup Node.js for validation
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Validate Node.js source and tests
        shell: pwsh
        run: |
          node --check server.js
          if ($LASTEXITCODE -ne 0) { throw "Syntax error in server.js" }
          node --check print-engine.js
          if ($LASTEXITCODE -ne 0) { throw "Syntax error in print-engine.js" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "SEZ Print Service tests failed" }

      - name: Checkout SEZPrintServiceHost source
        uses: actions/checkout@v4
        with:
          repository: Gabriel-SEZ/SEZPrintServiceHost
          ref: main
          path: .host-source

      - name: Compile and stage SEZPrintServiceHost.exe
        shell: pwsh
        run: |
          & "./.host-source/scripts/compile-host.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar SEZPrintServiceHost.exe." }

          $sourceExe = ".host-source/dist/SEZPrintServiceHost.exe"
          if (-not (Test-Path -LiteralPath $sourceExe -PathType Leaf)) {
            throw "Executável do host não foi gerado: $sourceExe"
          }

          New-Item -ItemType Directory -Path "service-host" -Force | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination "service-host/SEZPrintServiceHost.exe" -Force

          $staged = Get-Item "service-host/SEZPrintServiceHost.exe"
          if ($staged.Length -lt 4096) { throw "Executável do host parece incompleto: $($staged.Length) bytes" }
          [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "service-host/SEZPrintServiceHost.exe").Path) | Out-Null
          Write-Host "Host compilado e preparado para o Inno Setup: $($staged.Length) bytes"

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          $files = @('install-runtime.ps1', 'install-service.ps1', 'uninstall-service.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              throw ('Erro de sintaxe no script ' + $file)
            }
            Write-Host ('Sintaxe válida: ' + $file)
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler /Qp setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }

          $installer = "dist/SEZ-Print-Service-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer não foi gerado: $installer" }
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 100000) { throw "Instalador parece incompleto: $($item.Length) bytes" }
          Write-Host "Instalador pronto: $($item.FullName) ($($item.Length) bytes)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SEZ-Print-Service-Setup-Windows-x64
          path: dist/SEZ-Print-Service-Setup.exe
          if-no-files-found: error
          retention-days: 30
