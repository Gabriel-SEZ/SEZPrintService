name: Build SEZ Print Service installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "setup.iss"
      - "install-runtime.ps1"
      - "start-service.vbs"
      - "start-service.cmd"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler /Qp setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SEZ-Print-Service-Setup-Windows-x64
          path: dist/SEZ-Print-Service-Setup.exe
          retention-days: 30
