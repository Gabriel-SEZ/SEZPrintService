name: Build SEZ Print Service installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "print-engine.js"
      - "package.json"
      - "tests/**"
      - "setup.iss"
      - "install-service.ps1"
      - "prepare-update.ps1"
      - "uninstall-service.ps1"
      - "start-service.vbs"
      - "start-service.cmd"
      - "VERSION.txt"
      - "LEIA-ME.txt"
      - "README.md"
      - "LICENSE-SUMATRAPDF.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout SEZ Print Service
        uses: actions/checkout@v4

      - name: Setup Node.js for validation
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Validate Node.js source and tests
        shell: pwsh
        run: |
          node --check server.js
          if ($LASTEXITCODE -ne 0) { throw "Syntax error in server.js" }
          node --check print-engine.js
          if ($LASTEXITCODE -ne 0) { throw "Syntax error in print-engine.js" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "SEZ Print Service tests failed" }

      - name: Checkout SEZPrintServiceHost source
        uses: actions/checkout@v4
        with:
          repository: Gabriel-SEZ/SEZPrintServiceHost
          ref: main
          path: .host-source

      - name: Compile and stage SEZPrintServiceHost.exe
        shell: pwsh
        run: |
          & "./.host-source/scripts/compile-host.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar SEZPrintServiceHost.exe." }

          $sourceExe = ".host-source/dist/SEZPrintServiceHost.exe"
          if (-not (Test-Path -LiteralPath $sourceExe -PathType Leaf)) {
            throw "Executável do host não foi gerado: $sourceExe"
          }

          New-Item -ItemType Directory -Path "service-host" -Force | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination "service-host/SEZPrintServiceHost.exe" -Force

          $staged = Get-Item "service-host/SEZPrintServiceHost.exe"
          if ($staged.Length -lt 4096) { throw "Executável do host parece incompleto: $($staged.Length) bytes" }
          [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "service-host/SEZPrintServiceHost.exe").Path) | Out-Null
          Write-Host "Host compilado e preparado para o Inno Setup: $($staged.Length) bytes"

      - name: Download and stage bundled Node.js and SumatraPDF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $runtimeDir = 'runtime'
          $toolsDir = 'tools'
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null

          # Node.js 22.23.3 x64 ZIP — SHA-256 do manifesto oficial Node.js.
          $nodeVersion = '22.23.3'
          $nodeUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          $nodeExpected = '2b0ff57b049cda1bbcea2240eec20467018713c1efe1f7360c2681859b90ed71'
          $nodeZip = Join-Path $env:RUNNER_TEMP 'node-win-x64.zip'
          $nodeExtract = Join-Path $env:RUNNER_TEMP 'node-win-x64'
          Invoke-WebRequest -Uri $nodeUrl -OutFile $nodeZip -UseBasicParsing
          $nodeActual = (Get-FileHash -LiteralPath $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nodeActual -ne $nodeExpected) { throw "Node.js ZIP SHA-256 mismatch: $nodeActual" }
          Expand-Archive -LiteralPath $nodeZip -DestinationPath $nodeExtract -Force
          $nodeSource = Get-ChildItem -LiteralPath $nodeExtract -Filter 'node.exe' -File -Recurse | Select-Object -First 1
          if (-not $nodeSource) { throw 'node.exe não encontrado no ZIP oficial Node.js.' }
          # Empacotar node.exe e validar sua execução já na pasta final.
          # O binário oficial Windows é autocontido e não requer DLLs privadas ao lado.
          $nodeTarget = Join-Path $runtimeDir 'node.exe'
          Copy-Item -LiteralPath $nodeSource.FullName -Destination $nodeTarget -Force
          $nodeSize = (Get-Item -LiteralPath $nodeTarget).Length
          if ($nodeSize -lt 10000000) { throw "node.exe parece incompleto: $nodeSize bytes" }
          $nodeDetected = (& $nodeTarget --version).Trim()
          if ($nodeDetected -ne "v$nodeVersion") { throw "Versão Node.js embarcada inesperada: $nodeDetected" }
          Write-Host "Runtime Node.js preparado: $nodeDetected ($nodeSize bytes)"

          # SumatraPDF 3.6.1 x64 portátil — SHA-256 verificado do ZIP oficial.
          $sumatraVersion = '3.6.1'
          $sumatraUrl = "https://www.sumatrapdfreader.org/dl/rel/$sumatraVersion/SumatraPDF-$sumatraVersion-64.zip"
          $sumatraExpected = '98b33a518d42986856d225064b0cd2d3643ecf78cbf84ab873d26cc51877a544'
          $sumatraZip = Join-Path $env:RUNNER_TEMP 'SumatraPDF-64.zip'
          $sumatraExtract = Join-Path $env:RUNNER_TEMP 'SumatraPDF-64'
          Invoke-WebRequest -Uri $sumatraUrl -OutFile $sumatraZip -UseBasicParsing
          $sumatraActual = (Get-FileHash -LiteralPath $sumatraZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sumatraActual -ne $sumatraExpected) { throw "SumatraPDF ZIP SHA-256 mismatch: $sumatraActual" }
          Expand-Archive -LiteralPath $sumatraZip -DestinationPath $sumatraExtract -Force
          $sumatraSource = Get-ChildItem -LiteralPath $sumatraExtract -Filter 'SumatraPDF*.exe' -File -Recurse | Select-Object -First 1
          if (-not $sumatraSource) { throw 'Executável SumatraPDF não encontrado no ZIP oficial.' }
          # Incluir todos os recursos da distribuição portátil caso existam ao lado do EXE.
          Copy-Item -Path (Join-Path $sumatraSource.DirectoryName '*') -Destination $toolsDir -Recurse -Force
          $sumatraTarget = Join-Path $toolsDir 'SumatraPDF.exe'
          if (-not (Test-Path -LiteralPath $sumatraTarget -PathType Leaf)) {
            Copy-Item -LiteralPath $sumatraSource.FullName -Destination $sumatraTarget -Force
          }
          $sumatraSize = (Get-Item -LiteralPath $sumatraTarget).Length
          if ($sumatraSize -lt 1000000) { throw "SumatraPDF parece incompleto: $sumatraSize bytes" }
          Write-Host "SumatraPDF preparado: $sumatraSize bytes"

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          $files = @('prepare-update.ps1', 'install-service.ps1', 'uninstall-service.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              throw ('Erro de sintaxe no script ' + $file)
            }
            Write-Host ('Sintaxe válida: ' + $file)
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler /Qp setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }

          $installer = "dist/SEZ-Print-Service-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer não foi gerado: $installer" }
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 100000) { throw "Instalador parece incompleto: $($item.Length) bytes" }
          Write-Host "Instalador pronto: $($item.FullName) ($($item.Length) bytes)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SEZ-Print-Service-Setup-Windows-x64
          path: dist/SEZ-Print-Service-Setup.exe
          if-no-files-found: error
          retention-days: 30
